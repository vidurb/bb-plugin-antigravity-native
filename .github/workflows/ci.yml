name: CI
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: jdx/aube-action@v1
        with:
          node-version: "24"
          run-install: true
          cache: true
      - run: aube run --no-install format:check
      - run: aube run --no-install typecheck
      - run: aube run --no-install test
      - run: npx --yes --package=bb-app@0.48.1 bb plugin build .
